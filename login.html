<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 로그인 · blog8</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <aside class="spine">
      <div class="spine-dot"></div>
      <a href="index.html">blog8</a>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="mono"><a href="index.html">← 목록으로</a></div>
        <nav><a href="index.html">글</a></nav>
      </div>

      <section class="hero" style="margin-bottom:40px;">
        <h1>관리자 로그인</h1>
        <p>Supabase에 등록된 관리자 계정으로 로그인하세요.</p>
      </section>

      <form id="login-form" class="panel">
        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn">로그인</button>
      </form>
    </main>
  </div>

  <script type="module">
    import { bindLoginForm } from './js/auth.js';
    import { getSettings, applyFavicon } from './js/api.js';
    getSettings().then(s => applyFavicon(s.favicon_url));
    bindLoginForm();
  </script>
</body>
</html>
